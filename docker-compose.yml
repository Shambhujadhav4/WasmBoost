services:
  redis:
    image: redis:7-alpine
    container_name: datapilot-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./website/backend
      dockerfile: Dockerfile
    container_name: datapilot-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATAPILOT_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./website/backend/uploads:/app/uploads
      - ./website/backend/models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build:
      context: ./website/backend
      dockerfile: Dockerfile
    container_name: datapilot-celery-worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -c 2 --pool=threads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./website/backend/uploads:/app/uploads
      - ./website/backend/models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./website/frontend
      dockerfile: Dockerfile
    container_name: datapilot-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api
      - NEXT_PUBLIC_WS_BASE_URL=ws://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
  models_data:
