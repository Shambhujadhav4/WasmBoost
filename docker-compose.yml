services:
  nginx:
    image: nginx:alpine
    container_name: wasmboost-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # Uncomment for SSL
      # - "443:443"
    volumes:
      - ./website/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL certificates (e.g. Certbot)
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

  redis:
    image: redis:7-alpine
    container_name: wasmboost-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./website/backend
      dockerfile: Dockerfile
    container_name: wasmboost-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - WASMBOOST_CORS_ORIGINS=${WASMBOOST_CORS_ORIGINS:-${DATAPILOT_CORS_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1:3000}}
      - WASMBOOST_CORS_ORIGIN_REGEX=${WASMBOOST_CORS_ORIGIN_REGEX:-${DATAPILOT_CORS_ORIGIN_REGEX:-https://.*\.vercel\.app}}
    volumes:
      - uploads_data:/app/uploads
      - models_data:/app/models
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./website/backend
      dockerfile: Dockerfile
    container_name: wasmboost-celery-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -c 2 --pool=threads
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    volumes:
      - uploads_data:/app/uploads
      - models_data:/app/models
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./website/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api}
        - NEXT_PUBLIC_WS_BASE_URL=${NEXT_PUBLIC_WS_BASE_URL:-}
    container_name: wasmboost-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  redis_data:
  uploads_data:
  models_data:
