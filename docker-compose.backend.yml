services:
  nginx:
    image: nginx:alpine
    container_name: wasmboost-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-azure.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: wasmboost-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./website/backend
      dockerfile: Dockerfile
    container_name: wasmboost-backend
    restart: unless-stopped
    command: >
      gunicorn app.main:app
      --workers 1
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - WASMBOOST_CORS_ORIGIN_REGEX=https://.*\.vercel\.app
    volumes:
      - uploads_data:/app/uploads
      - models_data:/app/models
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./website/backend
      dockerfile: Dockerfile
    container_name: wasmboost-celery-worker
    restart: unless-stopped
    command: >
      celery -A app.core.celery_app.celery_app worker
      --loglevel=info -c 2 --pool=threads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
      - models_data:/app/models
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  uploads_data:
  models_data:
